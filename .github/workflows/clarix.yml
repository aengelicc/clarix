name: Clarix

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write  # required to upload SARIF to GitHub Code Scanning

jobs:
  clarix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: this workflow inlines the Clarix composite action so each step
      # is visible in the run UI. The reusable composite action lives at
      # .github/actions/clarix-scan and is what consumers would call via
      # `uses: aengelicc/clarix-scan@v1`. We inline here purely for
      # debuggability of the dev workflow itself.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Clarix CLI (from local backend/)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ./backend

      - name: Run Clarix scan
        id: scan
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "${{ runner.temp }}/clarix-out"
          cd "$GITHUB_WORKSPACE"
          clarix scan . \
            --format sarif \
            --severity-threshold low \
            --output "${{ runner.temp }}/clarix-out/results.sarif"
          EXIT_CODE=$?
          FINDING_COUNT=$(python .github/actions/clarix-scan/find_count.py "${{ runner.temp }}/clarix-out/results.sarif")
          {
            echo "sarif=${{ runner.temp }}/clarix-out/results.sarif"
            echo "finding-count=$FINDING_COUNT"
            echo "exit-code=$EXIT_CODE"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Clarix::$FINDING_COUNT finding(s) at threshold=low"
          exit 0

      - name: Upload SARIF to GitHub Code Scanning
        if: hashFiles('${{ steps.scan.outputs.sarif }}') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: clarix
        continue-on-error: true  # don't fail the workflow if Code Scanning rejects the upload

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: clarix
          message: |
            ## Clarix Security Scan

            **Findings:** ${{ steps.scan.outputs.finding-count }}
            **Threshold:** low

            <details>
            <summary>SARIF uploaded to GitHub Code Scanning under <code>clarix</code></summary>

            Open the **Security → Code scanning** tab to view annotated diffs and rule details.
            </details>
