name: 'Clarix Security Scan'
description: 'Run Clarix static analysis and produce a SARIF file. Uploading to GitHub Code Scanning and posting a PR comment are the caller's responsibility.'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  path:
    description: 'Path (relative to the repo root) to scan.'
    required: false
    default: '.'
  severity-threshold:
    description: 'Minimum severity to include in the SARIF output.'
    required: false
    default: 'low'
  fail-on:
    description: 'Severity at which the action exits non-zero. Defaults to severity-threshold.'
    required: false
    default: ''
  clarix-ref:
    description: 'Git ref (branch, tag, or SHA) of the aengelicc/clarix repo to install the CLI from.'
    required: false
    default: 'main'
  install-from:
    description: "How to install the Clarix CLI: 'remote' (clone aengelicc/clarix at clarix-ref) or 'local' (use the checkout's own backend/ directory — useful when developing Clarix in this same repo)."
    required: false
    default: 'remote'
  sarif-output:
    description: 'Absolute path on the runner where the SARIF file will be written.'
    required: false
    default: '${{ runner.temp }}/clarix-out/results.sarif'
  max-files:
    description: 'Override Clarix MAX_FILES (number of files to scan).'
    required: false
    default: ''
  python-version:
    description: 'Python version to use for the CLI.'
    required: false
    default: '3.11'

outputs:
  sarif-file:
    description: 'Path to the generated SARIF file (always set, even on findings).'
    value: ${{ steps.scan.outputs.sarif }}
  finding-count:
    description: 'Number of findings in the SARIF report.'
    value: ${{ steps.scan.outputs.finding-count }}
  exit-code:
    description: 'Exit code from the Clarix CLI (0 = clean, 1 = findings above fail-on).'
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Clarix CLI (from remote)
      if: inputs.install-from == 'remote'
      shell: bash
      run: |
        git clone --depth 1 --branch "${{ inputs.clarix-ref }}" \
          https://github.com/aengelicc/clarix.git "$RUNNER_TEMP/clarix"
        python -m pip install --upgrade pip
        python -m pip install "$RUNNER_TEMP/clarix/backend"

    - name: Install Clarix CLI (from local backend/)
      if: inputs.install-from == 'local'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install ./backend

    - name: Run Clarix scan
      id: scan
      continue-on-error: true
      shell: bash
      run: |
        set +e
        mkdir -p "$(dirname "${{ inputs.sarif-output }}")"
        cd "$GITHUB_WORKSPACE/${{ inputs.path }}"

        ARGS=(scan . --format sarif --severity-threshold "${{ inputs.severity-threshold }}")
        if [ -n "${{ inputs.fail-on }}" ]; then
          ARGS+=(--fail-on "${{ inputs.fail-on }}")
        fi
        if [ -n "${{ inputs.max-files }}" ]; then
          ARGS+=(--max-files "${{ inputs.max-files }}")
        fi
        ARGS+=(--output "${{ inputs.sarif-output }}")

        clarix "${ARGS[@]}"
        EXIT_CODE=$?

        FINDING_COUNT=$(python "${{ github.action_path }}/find_count.py" "${{ inputs.sarif-output }}")

        {
          echo "sarif=${{ inputs.sarif-output }}"
          echo "finding-count=$FINDING_COUNT"
          echo "exit-code=$EXIT_CODE"
        } >> "$GITHUB_OUTPUT"
        echo "::notice title=Clarix::$FINDING_COUNT finding(s) at threshold=${{ inputs.severity-threshold }}"
        exit 0
